<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SkillPassport — one verified career passport combining skills, projects, GitHub and certifications recruiters can trust." />
    <title>SkillPassport — Your skills. Verified.</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B0E0C'/%3E%3Ccircle cx='16' cy='16' r='9.5' fill='none' stroke='%23B8F34A' stroke-width='2' stroke-dasharray='4 3'/%3E%3Cpath d='M11.5 16.5l3 3 6-6.5' fill='none' stroke='%2362C98D' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var t = "dark";
        try {
          t = localStorage.getItem("sp-theme") || "dark";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.style.background = t === "light" ? "#f5f6f8" : "#09090b";
      })();
    </script>
    <style>
      html { background: #09090b; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
